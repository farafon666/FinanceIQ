[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "financeiq-backend"
version = "0.1.0"
description = "Backend package for FinanceIQ."
requires-python = ">=3.14.10,<3.15"
dependencies = [
    "SQLAlchemy[asyncio]==2.0.57",
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "fastapi==0.162.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    # asyncpg has no py.typed marker; keep strict checking without suppressions.
    "asyncpg-stubs==0.32.0",
    "httpx==0.28.1",
    "pip==26.2.2",
    "pip-tools==7.6.2",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.3",
    "mypy==2.4.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["financeiq", "financeiq.*"]
namespaces = false

[tool.pip-tools.compile]
extra = ["dev"]
all-build-deps = true
generate-hashes = true
allow-unsafe = true
strip-extras = true

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src"]
preview = false

[tool.ruff.per-file-target-version]
"../infra/compose/setup.py" = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "migrations", "tests", "../infra/compose/setup.py"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "9.2"
testpaths = ["tests/unit"]
addopts = "--import-mode=importlib --strict-config --strict-markers -ra"
markers = [
    "postgres: isolated real PostgreSQL; Docker is required",
    "compose: isolated full Compose lifecycle; Docker is required",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
